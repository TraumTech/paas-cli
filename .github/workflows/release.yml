name: release

run-name: ${{ github.event_name == 'workflow_dispatch' && format('release ({0})', inputs.bump) || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Какую часть версии поднять
        type: choice
        options:
          - patch
          - minor
        default: patch

concurrency: release

permissions:
  contents: write
  id-token: write

env:
  # Dogfooding: после релиза PaaS фиксирует версию paas-cli самим собой (VER-02) и
  # регистрирует зависимости этой версии из манифеста (PRT-05/CLI-15) — CLI тоже
  # реальный потребитель контракта. Сервис и состав зависимостей берёт из protocols.toml.
  PAAS_API: https://api.stapel.sh
  # paas-observability-sdk — приватный модуль: мимо proxy.golang.org, git с токеном.
  GOPRIVATE: github.com/TraumTech/*

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Доступ к приватным Go-модулям TraumTech
        run: git config --global url."https://x-access-token:${{ secrets.PAAS_REPOS_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: go test ./...
      - name: Поставить тег следующей версии
        if: github.event_name == 'workflow_dispatch'
        # Тег, запушенный GITHUB_TOKEN, новый запуск не порождает — релиз собирается здесь же.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::релиз выпускается только с main, а не с ${GITHUB_REF}"; exit 1
          fi
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            echo "::error::не найден ни один тег vX.Y.Z"; exit 1
          fi
          if [ "$(git rev-list -n1 "$latest")" = "$(git rev-parse HEAD)" ]; then
            echo "::error::на этом коммите уже стоит ${latest} — выпускать нечего"; exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "${{ inputs.bump }}" in
            minor) next="v${major}.$((minor + 1)).0" ;;
            *) next="v${major}.${minor}.$((patch + 1))" ;;
          esac
          git tag "$next"
          git push origin "$next"
          echo "Релиз ${next} (предыдущий ${latest})" >> "$GITHUB_STEP_SUMMARY"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Отдельный job (идемпотентный), чтобы публикацию можно было перезапустить
  # независимо от релиза через «Re-run failed jobs».
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить stapel
        run: |
          curl -fsSL "${PAAS_API}/cli/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Зафиксировать версию в PaaS
        id: version
        # Публикация версии идемпотентна (одна ревизия = одна версия): при «Re-run»
        # вернётся та же версия с тем же id. Этот id адресует зависимость.
        run: |
          version_id=$(stapel versions publish "${{ github.sha }}")
          echo "id=${version_id}" >> "$GITHUB_OUTPUT"
      - name: Зарегистрировать зависимости версии из манифеста
        # Регистрируем весь состав зависимостей из stapel.toml одной командой
        # (CLI-15). paas-cli потребляет одну актуальную версию контракта, поэтому
        # --prune (CLI-16): регистрируемая версия замещает зависимости прошлых версий —
        # платформа снимает их атомарно с регистрацией (PRT-12). Отдельный шаг снятия
        # (curl+jq) больше не нужен. Идемпотентно: повторный прогон — та же одна связь.
        run: stapel dependencies register --prune "${{ steps.version.outputs.id }}"
