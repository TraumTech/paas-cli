# paas.toml — единственный манифест репозитория для платформы (CLI-22):
# [service], зависимости и, у выкатываемых сервисов, форма ([[processes]]).
[service]
name = "paas-cli"


[[dependencies]]
name = "paas-backend"  # продьюсер, на контракте которого собран клиент платформы
methods = [
    "GET /organizations/current/clusters/required-access", # cluster_access_http: какие права платформа просит в кластере
    "GET /organizations/current/clusters", # cluster_directory_http: подключённые кластеры — оператор ставится только в подключённый (DB-05)
    "GET /organizations/current/database-servers/operators/{engine}", # database_operator_http: манифест оператора СУБД и право платформы (DB-05)
    "POST /organizations/current/clusters", # cluster_registrar_http: регистрация подключённого кластера
    "GET /services", # service_resolver_http: резолв имени продьюсера в id
    "GET /services/{id}", # protocol_source_http: метаданные сервиса перед получением контракта
    "GET /services/{id}/protocol", # protocol_source_http: получение контракта (sync/fetch)
    "GET /services/{id}/protocols", # registry_protocols_http: перечень протоколов сервиса в реестре (CLI-23)
    "GET /services/{id}/consumers", # registry_protocols_http: потребители сервиса — гейт исчезнувшего из манифеста протокола (CLI-23)
    "POST /services/{id}/versions", # version_publisher_http: публикация версии из выкатки
    "POST /services/{id}/builds", # build_publisher_http: публикация сборки ветки (DEP-18)
    "POST /services/{id}/protocol/compatibility", # protocol_compatibility_http: проверка кандидата
    "PUT /services/{id}/versions/{version_id}/dependencies", # dependency_registrar_http: регистрация зависимости
    "PUT /services/{id}/versions/{version_id}/protocol", # protocol_publish_http: публикация протокола
    "GET /tokens", # personal_token_http: под кем вошли по личному токену (AUTH-22)
    "DELETE /tokens/{tokenID}", # personal_token_http: выход отзывает выданный браузером токен (AUTH-22)
]
