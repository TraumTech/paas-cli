apiVersion: v1
kind: Namespace
metadata:
  name: stapel-logs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: stapel-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stapel-logs-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stapel-logs-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stapel-logs-collector
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: stapel-logs
---
apiVersion: v1
kind: Secret
metadata:
  name: collector
  namespace: stapel-logs
type: Opaque
data:
  key: {{ .KeyBase64 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector
  namespace: stapel-logs
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      stage.cri {}

      // Имя пода меняется с каждой выкаткой: не меткой, а метаданными строки.
      stage.structured_metadata {
        values = {
          pod = "",
        }
      }

      forward_to = [loki.write.platform.receiver]
    }

    loki.write "platform" {
      endpoint {
        url     = sys.env("LOGS_URL")
        headers = {
          "X-Stapel-Logs-Key" = sys.env("LOGS_KEY"),
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
  namespace: stapel-logs
spec:
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
      annotations:
        stapel.sh/settings: {{ .Checksum }}
    spec:
      serviceAccountName: collector
      securityContext:
        runAsUser: 0
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOGS_URL
              value: {{ .PushURL }}
            - name: LOGS_KEY
              valueFrom:
                secretKeyRef:
                  name: collector
                  key: key
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      tolerations:
        - operator: Exists
      volumes:
        - name: config
          configMap:
            name: collector
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: data
          hostPath:
            path: /var/lib/stapel-logs
            type: DirectoryOrCreate
